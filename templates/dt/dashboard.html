<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板 · {标题}</title>
<!--
  看板骨架 templates/dt/dashboard.html v1
  · 所有场景通用框架：页头(标题+日期+基调徽章) → 结论卡组 → 图表区 → 数据表 → 数据出处页脚
  · 颜色遵循 A 股惯例：涨=红 --up，跌=绿 --down
  · 生成时：替换 {{...}} 占位与 DEMO 数据；删除用不到的图表卡片；用不到的 helper 可留可删
  · 硬规则：正文（含注释）禁止出现知识条目编号（域-类-序号形式），规则用"名称+一句话"表达；
    页脚必须保留"数据出处"块（每个数字的来源文件/工具）
  · 各场景推荐图表：
      复盘 review   ：情绪指标卡组 + 连板梯队条形图(barChart) + 候选五维评分表(renderTable)
      单票 stock    ：分时价格+VWAP(mkIntraday) + 上/下行量堆叠(mkVolume) + 近60日收盘(mkLine) + 指标卡组
      对比 sector   ：对比矩阵表(renderTable 着色) + 关键指标横向条形对比(barChart horizontal)
      盘前 briefing ：昨日情绪卡组 + 观察清单表(renderTable)
-->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1b222c; --line:#2a323e;
  --text:#d8dee8; --muted:#8b95a5; --accent:#4c8dff;
  --up:#e5484d; --down:#2fb37c; --warn:#e2b341;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.65 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
/* 页头 */
header.bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
header.bar h1{font-size:20px;margin:0;letter-spacing:.5px}
header.bar .date{color:var(--muted);font-size:13px}
.badge{font-size:13px;padding:2px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2)}
.badge.up{color:var(--up);border-color:rgba(229,72,77,.45)}
.badge.down{color:var(--down);border-color:rgba(47,179,124,.45)}
.badge.warn{color:var(--warn);border-color:rgba(226,179,65,.45)}
.badge.cold{color:var(--accent);border-color:rgba(76,141,255,.45)}
/* 结论卡组 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{color:var(--muted);font-size:12px;margin-bottom:4px}
.card .v{font-size:17px;font-weight:600}
.card .s{font-size:12px;color:var(--muted);margin-top:4px}
.card .v.up{color:var(--up)} .card .v.down{color:var(--down)}
.card .v.warn{color:var(--warn)} .card .v.cold{color:var(--accent)}
/* 图表区 */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-bottom:16px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px}
.chart h3{margin:2px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.chart .ec{width:100%;height:260px}
.span6{grid-column:span 6}.span12{grid-column:span 12}.span4{grid-column:span 4}.span8{grid-column:span 8}
@media (max-width:760px){.span6,.span4,.span8{grid-column:span 12}}
/* 数据表 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--line);
  padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid rgba(42,50,62,.55);padding:6px 8px;vertical-align:top}
tr:last-child td{border-bottom:none}
td.up,span.up{color:var(--up)} td.down,span.down{color:var(--down)} td.warn{color:var(--warn)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:16px;overflow-x:auto}
.tbl h3{margin:2px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
/* 页脚出处 */
footer{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}
footer b{color:var(--text)}
.demo-tip{background:rgba(226,179,65,.12);border:1px solid rgba(226,179,65,.4);color:var(--warn);
  border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <div class="demo-tip" id="demoTip" hidden>当前为骨架演示数据——生成看板时必须整体替换，并删除本提示。</div>

  <header class="bar">
    <h1>{{标题：如 2026-10-19 晚间复盘 / 均胜电子短线分析}}</h1>
    <span class="date">{{日期}} · 数据截至 {{时点}}</span>
    <span class="badge {{tone}}">{{基调徽章：如 深冬·空仓观察}}</span>
  </header>

  <!-- SLOT cards：结论卡组（每张：标签/主值/副注；tone: up/down/warn/cold） -->
  <section class="cards" id="slot-cards"></section>

  <!-- SLOT charts：图表区（按需增删 .chart；span* 控宽） -->
  <section class="grid" id="slot-charts">
    <div class="chart span6"><h3>{{图1标题：如 分时价格与均价线}}</h3><div class="ec" id="chart-1"></div></div>
    <div class="chart span6"><h3>{{图2标题：如 上行/下行量分解}}</h3><div class="ec" id="chart-2"></div></div>
    <div class="chart span12"><h3>{{图3标题：如 连板梯队}}</h3><div class="ec" id="chart-3"></div></div>
  </section>

  <!-- SLOT table：数据表（候选评分/自选复检/对比矩阵/观察清单） -->
  <section class="tbl"><h3>{{表标题}}</h3><div id="slot-table"></div></section>

  <footer id="provenance">
    <b>数据出处</b>（看板中每个数字的来源）：{{逐条列出 数据 → 工具 → 落盘文件/当次返回}}
    <br>生成：{{技能名}} · 模板 templates/dt/dashboard.html v1
  </footer>
</div>

<script>
/* ================= 基础配置 ================= */
const UP='#e5484d', DOWN='#2fb37c', WARN='#e2b341', ACCENT='#4c8dff',
      MUTED='#8b95a5', LINE='#2a323e', TEXT='#d8dee8';
const FONT={fontFamily:'Microsoft YaHei,PingFang SC,sans-serif',fontSize:11,color:MUTED};
const AXIS={axisLine:{lineStyle:{color:LINE}},axisLabel:FONT,splitLine:{lineStyle:{color:'rgba(42,50,62,.5)'}}};
const grid={left:56,right:18,top:30,bottom:26};
const tooltip={trigger:'axis',backgroundColor:'#1b222c',borderColor:LINE,textStyle:{color:TEXT,fontSize:12}};

function toneClass(w){ /* 基调词→徽章色：跌/退/低迷/冬→down冷, 涨/发酵/暖→up, 谨慎→warn */
  if(/退潮|低迷|深冬|跌|冰点/.test(w))return 'down';
  if(/发酵|回暖|偏暖|涨|高潮/.test(w))return 'up';
  if(/谨慎|降温|预警/.test(w))return 'warn';
  return 'cold';
}
function card(k,v,s,tone){return `<div class="card"><div class="k">${k}</div>
  <div class="v ${tone||''}">${v}</div><div class="s">${s||''}</div></div>`;}
function setCards(html){document.getElementById('slot-cards').innerHTML=html;}
function chart(el){return echarts.init(document.getElementById(el),null,{renderer:'canvas'});}

/* ================= 图表助手 ================= */
/* 分时：价格线 + VWAP线 + 昨收虚线（单票场景） */
function mkIntraday(id,{times,price,vwap,prevClose}){
  chart(id).setOption({backgroundColor:'transparent',tooltip,grid,
    xAxis:{type:'category',data:times,...AXIS},
    yAxis:{scale:true,...AXIS},
    series:[
      {name:'价格',type:'line',data:price,showSymbol:false,lineStyle:{color:ACCENT,width:1.4}},
      {name:'均价线',type:'line',data:vwap,showSymbol:false,lineStyle:{color:WARN,width:1.2}},
      ...(prevClose?[{name:'昨收',type:'line',data:times.map(()=>prevClose),showSymbol:false,
        lineStyle:{type:'dashed',color:MUTED,width:1}}]:[])
    ]});
}
/* 上行/下行量堆叠：红=上行量 绿=下行量（单票承接） */
function mkVolume(id,{times,up,down}){
  chart(id).setOption({backgroundColor:'transparent',tooltip,grid,
    legend:{textStyle:FONT,top:0},
    xAxis:{type:'category',data:times,...AXIS},
    yAxis:{...AXIS},
    series:[
      {name:'上行量(万手/万元)',type:'bar',stack:'v',data:up,itemStyle:{color:UP}},
      {name:'下行量',type:'bar',stack:'v',data:down,itemStyle:{color:DOWN}}
    ]});
}
/* 通用折线/面积（日K收盘、序列趋势） */
function mkLine(id,{times,series,area}){
  chart(id).setOption({backgroundColor:'transparent',tooltip,grid,
    legend:series.length>1?{textStyle:FONT,top:0}:undefined,
    xAxis:{type:'category',data:times,...AXIS},
    yAxis:{scale:true,...AXIS},
    series:series.map(s=>({name:s.name,type:'line',data:s.data,showSymbol:false,
      lineStyle:{color:s.color||ACCENT,width:1.4},
      areaStyle:area?{color:{type:'linear',x:0,y:0,x2:0,y2:1,
        colorStops:[{offset:0,color:(s.color||ACCENT)+'33'},{offset:1,color:'transparent'}]}}:undefined}))});
}
/* 通用条形（连板梯队/指标对比；horizontal=true 横向） */
function mkBar(id,{cats,values,colors,unit}){
  const horizontal=!!(colors&&colors.h);
  chart(id).setOption({backgroundColor:'transparent',
    tooltip:{trigger:'item',backgroundColor:'#1b222c',borderColor:LINE,
      textStyle:{color:TEXT,fontSize:12},formatter:p=>`${p.name}：${p.value}${unit||''}`},
    grid:horizontal?{left:90,right:30,top:10,bottom:26}:grid,
    xAxis:{type:horizontal?'value':'category',data:horizontal?undefined:cats,...AXIS},
    yAxis:{type:horizontal?'category':'value',data:horizontal?cats:undefined,...AXIS},
    series:[{type:'bar',data:(values||[]).map((v,i)=>({
        value:v,itemStyle:{color:(Array.isArray(colors)?colors[i]:colors)||ACCENT}})),
      barMaxWidth:26,label:{show:true,position:horizontal?'right':'top',...FONT,color:TEXT}}]});
}
/* 数据表：columns=[...], rows=[[...]]；单元格内容原样输出（可带 <span class="up">） */
function renderTable(id,{columns,rows}){
  document.getElementById(id).innerHTML=
    `<table><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`+
    rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?'—':c}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;
}

/* ================= DEMO 数据（生成时整体替换并删除本段与 demoTip 显示） ================= */
const IS_DEMO=true;
if(IS_DEMO){document.getElementById('demoTip').hidden=false;}
(function demo(){
  if(!IS_DEMO)return;
  const times=['09:35','09:40','09:45','10:00','10:40','11:00','13:30','14:00','14:40','15:00'];
  setCards([
    card('综合基调','深冬 · 空仓观察','大盘环境低迷 × 博弈层退潮','down'),
    card('上证指数','3716.28','+0.24%（护盘性红盘，趋势仍弱）','warn'),
    card('两市成交额','15554 亿','较昨日缩量','warn'),
    card('连板晋级率','15.8%','6/38，高位断板多','down')
  ].join(''));
  const t=[];for(let i=0;i<48;i++)t.push(i<24?('09:3'+(i%10)):(i<36?('10:'+(i-24+10)):('11:'+(i-36))));
  const price=[],vwap=[];let p=18.6,v=18.6;
  for(let i=0;i<48;i++){p+=(Math.sin(i/6)+Math.random()-.5)*.06;v+=(p-v)*.08;price.push(+p.toFixed(2));vwap.push(+v.toFixed(2));}
  mkIntraday('chart-1',{times:t,price,vwap,prevClose:18.5});
  mkVolume('chart-2',{times:t.slice(0,20),
    up:t.slice(0,20).map((_,i)=>+(800+400*Math.abs(Math.sin(i))).toFixed(0)),
    down:t.slice(0,20).map((_,i)=>+(300+300*Math.abs(Math.cos(i))).toFixed(0))});
  mkBar('chart-3',{cats:['2板','3板','4板','5板+'],values:[18,5,2,1],
    colors:[DOWN,WARN,WARN,UP]});
  renderTable('slot-table',{columns:['标的','板块(环节)','总分/5','建议'],
    rows:[['示例A','传媒(退潮)','4/5','<span class="down">不入池·仅记录</span>'],
          ['示例B','低空经济(发酵)','3/5','<span class="warn">B级·备选</span>']]});
})();
/* 生成看板时的取数纪律：所有图表数据来自本次落盘文件（data/snapshots/<D>/…），
   禁止手敲凭印象的数字；缺数就少画一张图并在页脚注明。 */
</script>
</body>
</html>
